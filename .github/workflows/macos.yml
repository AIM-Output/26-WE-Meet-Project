# 맥에서도 도는지 — 실제 macOS 러너에서 단위 테스트 + 화면 빌드 + 데스크톱 사이드카 빌드·실행.
# 팀에 맥이 없어도 맥 지원이 깨지지 않게 지킨다 (WE-Meet_데스크톱앱_맥지원_계획.md).
# 학교 사이트에는 접속하지 않는다 — 테스트는 가짜 데이터, 사이드카는 준비 줄과 세션 확인(403)만 본다.
name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: univ_us_local/frontend/package-lock.json

      - name: 개발·빌드 venv (desktop/sidecar/requirements.txt — 저장소의 유일한 python venv)
        run: |
          python -m venv desktop/sidecar/.venv
          desktop/sidecar/.venv/bin/python -m pip install --disable-pip-version-check -q -r desktop/sidecar/requirements.txt

      - name: 단위 테스트 (C0 · C2 · C3 · F1~F8 · 백엔드)
        run: |
          set -e
          PY="$PWD/desktop/sidecar/.venv/bin/python"
          "$PY" -m pytest C0_Platform_agent/tests -q
          for d in C3_Login_agent C2_Profile_agent F1_Bachelor_agent F2_Graduation_agent F3_Attendance_agent \
                   F4_Textbook_agent F5_Test_agent F6_Eclass_agent F7_Task_agent F8_Plan_agent univ_us_local/backend; do
            echo "== $d"
            (cd "$d" && "$PY" -m pytest tests -q)
          done

      - name: 사이드카 빌드 (화면 npm run build → PyInstaller)
        run: desktop/sidecar/.venv/bin/python desktop/sidecar/build.py

      - name: 사이드카 실행 — 준비 줄 · 앱 창 밖 요청은 403
        run: |
          set -e
          DATA="$RUNNER_TEMP/univus-data"
          mkfifo "$RUNNER_TEMP/stdin"
          desktop/sidecar/dist/univus-backend/univus-backend --data-root "$DATA" --no-browser-install --exit-with-stdin \
            < "$RUNNER_TEMP/stdin" > ready.log 2> server.log &
          exec 3> "$RUNNER_TEMP/stdin"                        # 표준입력을 열어 둔다 — 닫으면 사이드카가 끝난다
          for i in $(seq 1 60); do grep -q '^UNIVUS_READY ' ready.log && break; sleep 1; done
          grep '^UNIVUS_READY ' ready.log || { cat server.log "$DATA/logs/backend.log" 2>/dev/null; exit 1; }
          PORT=$(sed -n 's/^UNIVUS_READY .*"port": \([0-9]*\).*/\1/p' ready.log)
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/api/status")" = 403
          exec 3>&-
          wait
